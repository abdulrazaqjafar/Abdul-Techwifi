# Nginx yenye HTTPS. Inasakinishwa na deploy/enable-https.sh baada ya cheti
# cha Let's Encrypt kupatikana.

server {
    listen 80 default_server;
    listen 8000;

    server_name tech-spherewifi.xyz www.tech-spherewifi.xyz _;
    root /var/www/techsphere/public;

    index index.php;
    charset utf-8;
    client_max_body_size 32M;

    # HAKUNA kulazimisha HTTPS hapa. Simu inapoangalia kama mtandao una
    # intaneti hutumia HTTP wazi, na kuielekeza kwenye HTTPS kunavuruga
    # utambuzi wa captive portal. Wateja wanaotumia jina la domain moja kwa
    # moja bado wanaelekezwa hapa chini.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/phpPHP_VERSION_PLACEHOLDER-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/techsphere-error.log;
    access_log /var/log/nginx/techsphere-access.log;
}

server {
    listen 443 ssl;
    http2 on;

    server_name tech-spherewifi.xyz www.tech-spherewifi.xyz;
    root /var/www/techsphere/public;

    index index.php;
    charset utf-8;
    client_max_body_size 32M;

    ssl_certificate     /etc/letsencrypt/live/tech-spherewifi.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tech-spherewifi.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/phpPHP_VERSION_PLACEHOLDER-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_read_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/techsphere-error.log;
    access_log /var/log/nginx/techsphere-access.log;
}
