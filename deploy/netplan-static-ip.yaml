# IP ya kudumu 192.168.20.253 — ileile PC inayotumia sasa, ili walled garden,
# login.html ya router na mipangilio yote ya MikroTik zibaki bila kubadilishwa.
#
# Hatua:
#   1. Tafuta jina la network interface:  ip -brief address
#   2. Badilisha "enp1s0" hapa chini kuwa jina ulilopata.
#   3. Nakili faili hii:
#        sudo cp deploy/netplan-static-ip.yaml /etc/netplan/01-techsphere.yaml
#        sudo chmod 600 /etc/netplan/01-techsphere.yaml
#        sudo netplan apply
#
# Kumbuka: DHCP ya MikroTik inatoa .20 hadi .200, hivyo .253 haitagongana na
# kifaa cha mteja.

network:
  version: 2
  renderer: networkd
  ethernets:
    enp1s0:
      dhcp4: false
      addresses:
        - 192.168.20.253/24
      routes:
        - to: default
          via: 192.168.20.1
      nameservers:
        addresses:
          - 192.168.20.1
          - 8.8.8.8
