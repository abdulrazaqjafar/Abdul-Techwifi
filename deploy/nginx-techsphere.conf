server {
    # Port 8000 imebaki hai kwa sababu login.html ya router na walled garden
    # zinaelekeza hapo. Hivyo hakuna kitu kinachohitaji kubadilishwa kwenye
    # MikroTik wakati mfumo unahamia kwenye seva hii.
    listen 80 default_server;
    listen 8000;

    # Jina la domain pamoja na "_" ili kufikiwa kwa IP kuendelee kufanya kazi.
    server_name tech-spherewifi.xyz www.tech-spherewifi.xyz _;
    root /var/www/techsphere/public;

    index index.php;
    charset utf-8;

    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/phpPHP_VERSION_PLACEHOLDER-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Malipo ya ClickPesa yanaweza kuchukua muda kabla ya kujibu.
        fastcgi_read_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/techsphere-error.log;
    access_log /var/log/nginx/techsphere-access.log;
}
